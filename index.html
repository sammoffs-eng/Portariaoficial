<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria Plaza - Sistema de Controle</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f4f7f9;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        h2 { color: var(--primary); text-align: center; font-size: 1.5rem; margin-bottom: 20px; border-bottom: 2px solid var(--accent); padding-bottom: 10px; letter-spacing: 1px; }
        
        .form-grid { display: flex; flex-direction: column; gap: 12px; }
        .field { display: flex; flex-direction: column; position: relative; }
        
        label { font-size: 0.75rem; font-weight: bold; color: #7f8c8d; margin-bottom: 5px; text-transform: uppercase; }
        
        input { padding: 14px; padding-right: 45px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 16px; background: #fff; outline: none; }
        input:focus { border-color: var(--accent); }

        .voice-btn {
            position: absolute;
            right: 10px;
            top: 28px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--accent);
            padding: 5px;
        }

        .btn-save { padding: 18px; background: var(--success); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px; font-size: 1rem; }

        .search-area { margin: 25px 0 15px 0; padding: 15px; background: #eef2f7; border-radius: 8px; border: 1px solid #d1d8e0; }
        #buscaGeral { width: 100%; box-sizing: border-box; border: 2px solid var(--accent); padding: 12px; border-radius: 8px; margin-top: 5px; }

        .btn-print { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }

        .card { background: white; border: 1px solid #e1e8ed; padding: 15px; margin-bottom: 12px; border-radius: 10px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .visitor-name { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
        .apto-badge { background: var(--primary); color: white; padding: 3px 8px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }
        
        .card-detail { font-size: 0.85rem; color: #555; margin-bottom: 4px; }
        .times-box { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #eee; font-size: 0.75rem; }
        .time-in { color: var(--success); font-weight: bold; }
        .time-out { color: var(--danger); font-weight: bold; }

        .btn-exit { width: 100%; padding: 12px; background: #fdf2f2; color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        @media print {
            .form-grid, .search-area, .btn-print, .btn-exit, .voice-btn, h2 { display: none !important; }
            .container { box-shadow: none; max-width: 100%; }
            .print-header { display: block !important; text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="print-header">
        <h1>PORTARIA PLAZA</h1>
        <p>Relatório de Acesso de Visitantes</p>
    </div>

    <h2>🏢 Portaria Plaza</h2>
    
    <div class="form-grid">
        <div class="field">
            <label>Visitante</label>
            <input type="text" id="nome" placeholder="Nome completo">
            <button class="voice-btn" onclick="ouvirVoz('nome')">🎤</button>
        </div>
        <div class="field">
            <label>RG / CPF</label>
            <input type="text" id="identidade" placeholder="Documento">
            <button class="voice-btn" onclick="ouvirVoz('identidade')">🎤</button>
        </div>
        <div class="field">
            <label>Apartamento</label>
            <input type="text" id="apto" placeholder="Ex: 101">
            <button class="voice-btn" onclick="ouvirVoz('apto')">🎤</button>
        </div>
        <div class="field">
            <label>Assunto</label>
            <input type="text" id="assunto" placeholder="Ex: Entrega, Manutenção">
            <button class="voice-btn" onclick="ouvirVoz('assunto')">🎤</button>
        </div>
        <div class="field">
            <label>Autorizado por</label>
            <input type="text" id="autorizador" placeholder="Morador">
            <button class="voice-btn" onclick="ouvirVoz('autorizador')">🎤</button>
        </div>
        <button class="btn-save" onclick="salvar()">REGISTRAR ENTRADA</button>
    </div>

    <div class="search-area">
        <label>🔍 BUSCA POR APTO OU DATA:</label>
        <input type="text" id="buscaGeral" onkeyup="filtrarGeral()" placeholder="Pesquisar...">
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ Imprimir Lista</button>

    <div id="listaContainer"></div>
</div>

<script>
    // Recupera os dados do LocalStorage
    let registros = JSON.parse(localStorage.getItem('portaria_plaza_v1')) || [];

    function ouvirVoz(campoId) {
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!window.SpeechRecognition) return alert("Reconhecimento de voz não suportado neste navegador.");
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.start();

        recognition.onresult = (event) => {
            document.getElementById(campoId).value = event.results[0][0].transcript.replace(/\.$/, "");
        };
    }

    function salvar() {
        const nome = document.getElementById('nome').value;
        const apto = document.getElementById('apto').value;
        const identidade = document.getElementById('identidade').value;
        const assunto = document.getElementById('assunto').value;
        const autorizador = document.getElementById('autorizador').value;

        if (!nome || !apto) return alert("⚠️ Nome e Apartamento são obrigatórios!");

        const agora = new Date();
        const novo = {
            id: Date.now(),
            nome: nome, 
            identidade: identidade,
            apto: apto, 
            assunto: assunto, // Aqui estava sendo gravado, mas não exibido
            autorizador: autorizador,
            data: agora.toLocaleDateString('pt-BR'),
            horaEntrada: agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
            horaSaida: null
        };

        registros.unshift(novo);
        localStorage.setItem('portaria_plaza_v1', JSON.stringify(registros));
        
        // Limpa todos os inputs
        document.querySelectorAll('.field input').forEach(i => i.value = '');
        
        renderizar(registros);
    }

    function registrarSaida(id) {
        const idx = registros.findIndex(r => r.id === id);
        if (idx !== -1) {
            registros[idx].horaSaida = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            localStorage.setItem('portaria_plaza_v1', JSON.stringify(registros));
            renderizar(registros);
        }
    }

    function renderizar(lista) {
        const container = document.getElementById('listaContainer');
        container.innerHTML = lista.map(item => `
            <div class="card">
                <div class="card-header">
                    <span class="visitor-name">${item.nome}</span>
                    <span class="apto-badge">APT ${item.apto}</span>
                </div>
                <div class="card-detail"><strong>Doc:</strong> ${item.identidade || '-'}</div>
                <div class="card-detail"><strong>Assunto:</strong> ${item.assunto || 'Não informado'}</div>
                <div class="card-detail"><strong>Autorizado:</strong> ${item.autorizador || '-'}</div>
                <div class="times-box">
                    <span class="time-in">Entrada: ${item.data} - ${item.horaEntrada}</span>
                    <span class="time-out">${item.horaSaida ? 'Saída: ' + item.horaSaida : 'No Prédio'}</span>
                </div>
                ${!item.horaSaida ? `<button class="btn-exit" onclick="registrarSaida(${item.id})">Registrar Saída</button>` : ''}
            </div>
        `).join('');
    }

    function filtrarGeral() {
        const termo = document.getElementById('buscaGeral').value.toLowerCase();
        const filtrados = registros.filter(r => 
            r.apto.toLowerCase().includes(termo) || 
            r.data.includes(termo)
        );
        renderizar(filtrados);
    }

    // Inicializa a lista ao carregar a página
    renderizar(registros);
</script>

</body>
</html>
